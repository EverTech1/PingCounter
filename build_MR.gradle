plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.36,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

def targetJavaFile = "src/main/resources/META-INF/mods.toml"
def updateURL_modrinth = "https://gist.githubusercontent.com/EverTech1/2a2b99b663a910156457a59ecec0375e/raw/updateModrinth.json"
def downloadURL_modrinth = "https://modrinth.com/mod/ping-counter"

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    reobf = true
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}
sourceSets.main.resources { srcDir 'src/generated/resources' }
repositories {
    maven { url "https://repo.spongepowered.org/maven" }
    maven { url = 'https://maven.parchmentmc.org' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'mixins.pingcounter.refmap.json'
    config 'mixins.pingcounter.json'
}
sourceSets {
    main {
        ext.refMap = "mixins.${mod_id}.refmap.json"
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    from("$projectDir/build/classes/java") {
        include '**/*.refmap.json'
    }
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

}

tasks.register("deleteLibsFile"){
    def file = file("$projectDir/build/libs/$archivesBaseName-$version"+".jar")
    file.delete();
}
tasks.register("copyFiles", Copy){
    from "$projectDir/build/libs/$archivesBaseName-$version"+".jar"
    into "$projectDir/build/jars/modrinth/"
    finalizedBy deleteLibsFile
}
tasks.register("restoreFiles"){
    doLast {
        def file = file(targetJavaFile)
        file.text = file.text.replace(updateURL_modrinth, "PLACEHOLDER_JSON")
        file.text = file.text.replace(downloadURL_modrinth, "PLACEHOLDER_DOWNLOAD")
    }
}

tasks.register("modifyConstants"){
    doLast{
        def file = file(targetJavaFile)
        file.text = file.text.replace("PLACEHOLDER_JSON", updateURL_modrinth)
        file.text = file.text.replace("PLACEHOLDER_DOWNLOAD", downloadURL_modrinth)
    }
}
tasks.named('build'){
    finalizedBy copyFiles
}
tasks.named('compileJava'){
    dependsOn modifyConstants
    finalizedBy restoreFiles
}
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : "mixins.${mod_id}.json"
        ])
    }
}
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}
